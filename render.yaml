services:
  - type: web
    name: attendance-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Supabase Postgres connection string (pooler, port 6543).
      # Paste manually in the Render dashboard — not synced from this file.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: attendance-files
      # Auto-generated by Render on first Blueprint deploy — do not reuse
      # the values that were ever committed to this repo.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      # Comma-separated list of allowed frontend origins (no trailing slash).
      # e.g. https://attendance.redlecare.in,https://attendance-system.vercel.app
      - key: CLIENT_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
